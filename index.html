<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 5 - JavaScript Basics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4" style="max-width: 800px;">
    <h1 class="mb-4">JavaScript Basics: DOM and Events</h1>

    <!-- Part 1: Profile object, data types and arithmetic -->
    <section class="mb-5">
      <h2 class="h4">Part 1. Profile Object, Data Types and Arithmetic</h2>
      <div class="card">
        <ul class="list-group list-group-flush" id="profileOutput">
          <li class="list-group-item">Name: <span id="outName"></span></li>
          <li class="list-group-item">Birth year: <span id="outBirthYear"></span></li>
          <li class="list-group-item">Is developer: <span id="outDeveloper"></span></li>
          <li class="list-group-item">Hobbies: <span id="outHobbies"></span></li>
          <li class="list-group-item">Current age: <span id="outAge"></span></li>
          <li class="list-group-item">Age in months: <span id="outMonths"></span></li>
          <li class="list-group-item">Total hobbies: <span id="outHobbiesCount"></span></li>
        </ul>
      </div>
    </section>

    <!-- Part 2: Form input and event responses -->
    <section class="mb-5">
      <h2 class="h4">Part 2. Form Input and Event Responses</h2>
      <form id="profileForm">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required>
          </div>
          <div class="col-12 col-md-6">
            <label for="birthYear" class="form-label">Birth Year</label>
            <input type="number" class="form-control" id="birthYear" min="1900" max="2026" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Create / Update Profile</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Part 3: DOM list manipulation -->
    <section class="mb-5">
      <h2 class="h4">Part 3. DOM List Manipulation</h2>
      <div class="input-group mb-3">
        <input type="text" class="form-control" id="newItem" placeholder="Enter a new hobby">
        <button type="button" class="btn btn-success" id="addBtn">Add Item</button>
        <button type="button" class="btn btn-danger" id="removeBtn">Remove Item</button>
      </div>
      <ul id="hobbyList"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
